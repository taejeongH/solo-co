# Application
spring.application.name=solo-co
spring.profiles.active=local

# MyBatis
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.type-aliases-package=com.ssafy

# AWS S3
cloud.aws.s3.bucket=myapp-thumbnail-bucket
cloud.aws.credentials.accessKey=${AWS_ACCESSKEY}
cloud.aws.credentials.secretKey=${AWS_SECRETKEY}
cloud.aws.region.static=ap-northeast-2

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET}
#jwt.access-expiration-time=1800000
#jwt.refresh-expiration-time=1209600000
jwt.access-expiration-time=86400000
jwt.refresh-expiration-time=1209600000

# GMS API KEY
spring.ai.openai.api-key=${GMS_API_KEY}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/
spring.ai.openai.chat.completions-path=chat/completions
spring.ai.openai.chat.options.model=gpt-4o-mini

#Google Places API Key
google.places.api.key=${GOOGLE_PLACES_API_KEY}
